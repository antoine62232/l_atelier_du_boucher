name: Garder la base Aiven active

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appel d'une route qui interroge la base
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors \
            --max-time 120 \
            -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://l-atelier-du-boucher.onrender.com/api/faq/all
